{% extends 'base.html' %}
{% load static %}

{% block title %}Starforge Gaming | Login{% endblock %}

{% block content %}

<div class="login-container">

        <form action="#" method="POST" id="edit-perfil-form" enctype="multipart/form-data">
                {% csrf_token %}
                
                <span><h2 class="login-title">Auth Login</h2></span>

                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="mail"><i class="fa-solid fa-user"></i></ion-icon>
                    </span>
                    <input type="email" name="email" value="{{ user.email }}" required>
                    <label for="email">Email</label>
                    <div class="input-line"></div>
                </div>

                <div class="input-box">
                    <span class="icon">
                        <ion-icon name="lock-closed"><i class="fa-solid fa-lock"></i></ion-icon>
                    </span>
                    <input type="password" name="password" value="{{ user.email }}" required>
                    <label for="password">Password</label>
                    <div class="input-line"></div>
                </div>

                <div class="remember-forgot">
                    <label>
                        <input type="checkbox" name="remember_me" id="remember_me">
                        Recuérdame 
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <div class="account">
                    <label>
                        ¿Aún no tienes cuenta?
                    </label>
                    <a href="#">Regístrate aquí</a>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>
    </div>

{% endblock %}
