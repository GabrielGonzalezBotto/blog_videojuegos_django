{% extends 'base.html' %}
{% load static %}

{% block title %}Starforge Gaming | Editar Perfil{% endblock %}

{% block content %}

 <div class="contenedor-perfil">
        <h2>EDITAR PERFIL</h2> 

        <!-- El formulario apunta a sí mismo y procesa archivos multimedia -->
        <form method="POST" enctype="multipart/form-data"> 
            {% csrf_token %} 

            <div class="img-perfil-container" style="position: relative; width: 150px; height: 150px; margin: 0 auto;"> 
                <!-- Si el usuario ya tiene foto la muestra; si no, muestra la de por defecto -->
                {% if user.imagen_perfil %} 
                    <img src="{{ user.imagen_perfil.url }}" alt="Foto de perfil" class="img-perfil" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"> 
                {% else %}
                    <img src="{% static 'img/profiles/perfil-5.jpg' %}" alt="Foto por defecto" class="img-perfil" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                {% endif %}
                
                <!-- Icono sobre la foto para hacer click -->
                <label for="profile-pic-input" class="icon-container" style="position: absolute; bottom: 0; right: 0; cursor: pointer; background: #fff; padding: 5px; border-radius: 50%;"> 
                    <span style="font-size: 20px;">📷</span>
                </label> 
                <!-- El input oculto que Django leerá mediante el name -->
                <input type="file" id="profile-pic-input" accept="image/*" name="imagen_perfil" style="display: none;"> 
            </div> 

            <!-- Datos actuales del usuario -->
            <div style="text-align: center; margin-top: 10px;">
                <h3>{{ user.username }}</h3> 
                <p>{{ user.email }}</p> 
            </div>

            <!-- Campo Nombre de Usuario -->
            <div class="input-box" style="margin: 15px 0;"> 
                <label for="nombre">Nombre de Usuario:</label>
                <input type="text" name="username" id="nombre" value="{{ user.username }}" required> 
            </div> 

            <!-- Campo Email -->
            <div class="input-box" style="margin: 15px 0;"> 
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" value="{{ user.email }}" required> 
            </div> 

            <!-- Botones -->
            <div class="btn-container"> 
                <button type="submit">GUARDAR CAMBIOS</button> 
                <a href="{% url 'inicio' %}" class="btn-cancelar">CANCELAR</a>
            </div> 
        </form>
    </div>

    <!-- Script para cambiar la vista previa de la foto al elegir un archivo nuevo -->
    <script>
        const fileInput = document.getElementById('profile-pic-input');
        const profileImg = document.querySelector('.img-perfil');

        fileInput.addEventListener('change', function() {
            const file = this.files[0]; // Corregido para tomar el primer archivo
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    profileImg.setAttribute('src', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>

{% endblock %}
